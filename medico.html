<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <style>
    .btn-tv {
      background: #d690ff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }
    .btn-tv:hover { background: #e066ff; }
    .btn-abrir-tv {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-abrir-tv:hover { background: #da5ff2; }
    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #f0f4ff;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #d0d8f0;
    }
    .consultorio-input label { font-weight: bold; }
    .consultorio-input input {
      width: 60px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Cabeçalho com botão da TV -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">🩺 Painel Médico</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
  </div>

  <!-- Campo criado para informar o consultório e chamar o paciente na TV -->
  <div class="consultorio-input">
    <label>Meu Consultório:</label>
    <input type="text" id="consultorio-num" value="01">
    <span style="color:#666; font-size:13px;">Este número será exibido na TV ao chamar o paciente.</span>
  </div>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input id="paciente" placeholder="Paciente" readonly>
  <input id="diagnostico" placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>

  <button onclick="salvar()">Salvar</button>

</div>

<script>

let triagensCarregadas = [];


async function carregar() {
  const div = document.getElementById("triagens");

  try {
    const resposta = await fetch("/triagens");
    const data = await resposta.json();

    if (!resposta.ok) {
      throw new Error(data.erro || "Erro ao buscar triagens.");
    }

    triagensCarregadas = data;

    div.innerHTML = "";

    if (data.length === 0) {
      div.innerHTML = `
        <p style="color:#888; text-align:center;">
          Nenhum paciente na fila.
        </p>
      `;
      return;
    }

    data.forEach((t, index) => {
      const card = document.createElement("div");
      card.className = "card";

      const titulo = document.createElement("h3");
      titulo.textContent = t.nome;

      const sintoma = document.createElement("p");
      sintoma.innerHTML = "<b>Sintoma:</b> ";
      sintoma.append(document.createTextNode(t.sintoma || "Não informado"));

      const temperatura = document.createElement("p");
      temperatura.innerHTML = "<b>Temperatura:</b> ";
      temperatura.append(
        document.createTextNode(
          t.temperatura == null ? "Não informada" : `${t.temperatura}°C`
        )
      );

      const risco = document.createElement("p");
      const etiqueta = document.createElement("span");
      etiqueta.className = t.risco || "verde";
      etiqueta.textContent = t.risco || "Não classificado";
      risco.append(etiqueta);

      const alergia = document.createElement("p");
      alergia.innerHTML = "<b>Alergia:</b> ";
      alergia.append(document.createTextNode(t.alergia || "Nenhuma"));

      const observacao = document.createElement("p");
      observacao.innerHTML = "<b>Observação:</b> ";
      observacao.append(document.createTextNode(t.observacao || "Nenhuma"));

      const botoes = document.createElement("div");
      botoes.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;";

      const botaoAtender = document.createElement("button");
      botaoAtender.textContent = "Atender";
      botaoAtender.addEventListener("click", () => selecionar(index));

      const botaoTV = document.createElement("button");
      botaoTV.className = "btn-tv";
      botaoTV.textContent = "📺 Chamar na TV";
      botaoTV.addEventListener("click", () => chamarNaTV(t.nome));

      botoes.append(botaoAtender, botaoTV);
      card.append(titulo, sintoma, temperatura, risco, alergia, observacao, botoes);
      div.appendChild(card);
    });

  } catch (erro) {
    console.error("Erro ao carregar pacientes:", erro);
    div.innerHTML = `
      <p style="color:red;">
        Erro ao carregar os pacientes. Verifique se o servidor está funcionando.
      </p>
    `;
  }
}

// Função criada para enviar o nome do paciente para a TV quando ele for chamado no consultório.
function chamarNaTV(nome) {
  const consultorio = document.getElementById("consultorio-num").value || "01";
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "CONSULTÓRIO",
      localNumero: consultorio,
      paciente: nome
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("✅ " + nome + " foi chamado na TV para o Consultório " + consultorio + "!");
  });
}

function selecionar(index) {
  const t = triagensCarregadas[index];
  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }
}

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {
      const select = document.getElementById("medicacao");
      select.innerHTML = `<option value="">Selecione a medicação</option>`;
      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    });
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) { alert("Selecione um paciente clicando em Atender."); return; }
  if (!medicacao) { alert("Selecione uma medicação."); return; }

  fetch("/consulta", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paciente, diagnostico, medicacao, obs })
  })
  .then(r => r.json())
  .then(() => {
    alert("Consulta salva");
    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
  });
}

carregar();
carregarMedicacoes();

// Atualiza lista automaticamente a cada 10 segundos
setInterval(carregar, 10000);

</script>

</body>
</html>
